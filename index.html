<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Bootstrap + JS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

  <div class="container text-center">
    <h1 class="mb-4">Mi Página con Bootstrap 5.3</h1>
    
    <button id="btnSaludar" class="btn btn-primary">Haz clic para saludar</button>
    
    <p class="mt-3" id="mensaje"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("btnSaludar").addEventListener("click", function () {
      document.getElementById("mensaje").textContent = "¡Hola desde JavaScript con Bootstrap!";
    });
  </script>
</body>
</html>
